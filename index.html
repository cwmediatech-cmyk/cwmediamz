<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cine Way — Assista filmes, séries e animes a qualquer hora. Download rápido e seguro para Android.">
<title>Cine Way — Download Oficial</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #050505;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(255, 123, 0, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0, 255, 157, 0.05) 0%, transparent 50%);
  }
  a{
    margin-bottom: 10px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #121214 0%, #0a0a0c 100%);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 28px;
    padding: 40px 32px 36px;
    text-align: center;
    box-shadow:
      0 0 0 1px rgba(255, 123, 0, 0.04),
      0 25px 50px -12px rgba(0, 0, 0, 0.6);
  }

  .logo-wrap {
    width: 88px;
    height: 88px;
    margin: 0 auto 20px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(255, 123, 0, 0.35);
    background: #111;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 14px;
    color: #8a8a8a;
    font-weight: 500;
    margin-bottom: 28px;
  }

  .version-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 255, 157, 0.1);
    border: 1px solid rgba(0, 255, 157, 0.25);
    color: #00ff9d;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 24px;
  }

  .version-badge i {
    font-size: 11px;
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #16161a;
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 28px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #00ff9d;
    border-radius: 50%;
    box-shadow: 0 0 8px #00ff9d;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .status span {
    font-size: 13px;
    font-weight: 500;
    color: #c0c0c0;
  }

  .features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }

  .feature {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .feature i {
    font-size: 18px;
    color: #ff7b00;
  }

  .feature span {
    font-size: 12px;
    font-weight: 500;
    color: #b0b0b0;
  }

  .description {
    font-size: 14px;
    line-height: 1.65;
    color: #9a9a9a;
    margin-bottom: 28px;
  }

  .download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: linear-gradient(135deg, #ff7b00 0%, #ff9d00 100%);
    color: #fff;
    text-decoration: none;
    padding: 16px 24px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px rgba(255, 123, 0, 0.3);
  }

  .download:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(255, 123, 0, 0.4);
  }

  .download:active {
    transform: translateY(0);
  }

  .info {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .info-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #777;
  }

  .info-item i {
    font-size: 11px;
    color: #555;
  }
</style>
</head>
<body>

  <div class="card">

    <div class="logo-wrap">
      <img src="logo_cw.png" alt="Cine Way Logo">
    </div>

    <h1>Cine Way</h1>
    <p class="tagline">Filmes, séries e animes a qualquer hora</p>

    <div class="version-badge">
      <i class="fas fa-tag"></i>
      Versão 1.5
    </div>

    <div class="status">
      <div class="status-dot"></div>
      <span>Sistema Online</span>
    </div>
    <a href="Cine_Way_v1.5.apk" download class="download">
      <i class="fas fa-download"></i>
      Baixar Agora
    </a>

    <div class="features">
      <div class="feature">
        <i class="fas fa-film"></i>
        <span>Filmes</span>
      </div>
      <div class="feature">
        <i class="fas fa-tv"></i>
        <span>Séries</span>
      </div>
      <div class="feature">
        <i class="fas fa-dragon"></i>
        <span>Animes</span>
      </div>
      <div class="feature">
        <i class="fas fa-broadcast-tower"></i>
        <span>Ao Vivo</span>
      </div>
    </div>

    <p class="description">
      Assista filmes, séries e animes a qualquer hora em um único aplicativo.
      Atualizações constantes de conteúdo e ícones. Downloads rápidos e estáveis.
    </p>

    

    <div class="info">
      <div class="info-item">
        <i class="fas fa-hdd"></i>
        ~15 MB
      </div>
      <div class="info-item">
        <i class="fas fa-mobile-alt"></i>
        Android 5 – 15
      </div>
    </div>

  </div>

</body>
</html>
